server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s ipv6=off;
  absolute_redirect off;

  location ~ ^/fotolog/(users|profiles|profile|posts|favorites)(/|$) {
    client_max_body_size 3m;
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://api:3001/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The admin page is a frontend route; only /admin/* endpoints go to the API.
  location = /admin {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location = /admin/ {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location ~ ^/(auth|admin|users|friends|friend-requests|conversations|messages|unread-messages|music|health|ct)(/|$) {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /version.json {
    add_header Cache-Control "no-store";
  }

  location = /win98 {
    return 302 /win98-web/$is_args$args;
  }

  location ^~ /win98/ {
    rewrite ^/win98/(.*)$ /win98-web/$1 redirect;
  }

  location = /win98-web {
    return 301 /win98-web/;
  }

  location ^~ /win98-web/ {
    set $win98_upstream http://win98:80;
    proxy_pass $win98_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
